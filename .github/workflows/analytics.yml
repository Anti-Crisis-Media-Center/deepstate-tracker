name: Аналітика соцмереж — щотижневий звіт
on:
  schedule:
    - cron: "0 8 * * 1"   # понеділок 10:00 за Києвом (зимовий час)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Лише показати звіт у журналі, не надсилати"
        type: boolean
        default: false
      script:
        description: "Скрипт"
        default: "analytics.py"
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          ANALYTICS_BOT_TOKEN: ${{ secrets.ANALYTICS_BOT_TOKEN }}
          ANALYTICS_CHAT_ID: ${{ secrets.ANALYTICS_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python ${{ inputs.script || 'analytics.py' }}
