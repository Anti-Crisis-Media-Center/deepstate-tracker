name: Листівки — перевірка доступів

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kartky/check_access.py"
      - ".github/workflows/kartky_check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests google-auth
      - name: Перевірити календар, Диск і Telegram
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KARTKY_CHAT_ID: "-1003946430136"   # Суперчат АКМЦ
          KARTKY_THREAD_ID: "6"              # гілка «тест»
        run: python kartky/check_access.py
      - name: Зберегти звіт
        run: |
          git config user.name "deepstate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kartky_check.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Листівки: звіт перевірки доступів"
          git pull --rebase
          git push
