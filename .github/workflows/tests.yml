name: Автотести

# Перевіряють підрахунки й назви на «контрольних зразках» щоразу, коли змінюється код.
# Червоний хрестик тут — сигнал: зміна щось зламала, у робочу версію її не вносити.
on:
  push:
    paths: ["**.py", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
