name: DeepState — моніторинг змін

on:
  schedule:
    # Стартуємо завчасно: скрипт сам чекає до 8:00 за Києвом і публікує вчасно,
    # навіть якщо GitHub запустить задачу із запізненням.
    - cron: "30 4 * * *"   # 06:30 зима / 07:30 літо (Київ)
    - cron: "30 5 * * *"   # 07:30 зима / 08:30 літо (Київ)
    - cron: "17 8 * * *"   # запасний: 10:17 зима / 11:17 літо — якщо ранкові не відбулися
  workflow_dispatch:
    inputs:
      force:
        description: "Запустити зараз, ігноруючи час і перевірку «вже опубліковано»"
        type: boolean
        default: false
      dry_run:
        description: "Тестовий запуск: порахувати, але не надсилати в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deepstate-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Порівняти карти і опублікувати
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          FB_TELEGRAM_LINK: ${{ secrets.FB_TELEGRAM_LINK }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '111460408546782' }}  # біла сторінка «У фокусі» (токен системного користувача)
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python tracker.py

      - name: Зберегти знімок карти в репозиторій
        if: always()
        run: |
          git config user.name "deepstate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Змін у даних немає"
          else
            git commit -m "Дані DeepState $(TZ=Europe/Kyiv date +%F)"
            git pull --rebase
            git push
          fi
