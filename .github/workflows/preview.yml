name: Прев'ю в Тести

# 28.11.2026: прев'ю відео в Суперчат АКМЦ (гілка «DeepState»), без публікації.
# Запуск: зміна файлу preview/request.json (так може й Claude) або вручну.
on:
  push:
    paths: ["preview/request.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg для відео
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Прев'ю
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          DRY_RUN: "1"
        run: python preview/preview.py
