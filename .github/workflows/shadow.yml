name: Тінь v9 — нова версія в гілку «Тести»

# Тимчасово (9–15.11.2026): нова версія (гілка v9-video) щодня робить те саме, що й робочий бот,
# але надсилає все лише в гілку «Тести» службової групи. Нічого не публікує і не зберігає.
# Після переходу на нову версію (16.11) цей файл видалити.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "day — доба, week — тиждень (Reels)"
        type: choice
        options: [day, week]
        default: day

permissions:
  contents: write   # щоб класти тестове відео в GitHub Releases

concurrency:
  group: deepstate-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: demo-first-frame
          fetch-depth: 0
      - name: Свіжі дані з робочої гілки
        run: |
          git fetch origin main
          git checkout origin/main -- data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg для відео
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Тіньовий запуск
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '111460408546782' }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SHADOW_KIND: ${{ inputs.kind || (github.event.schedule == '0 18 * * 0' && 'week' || 'day') }}
          DRY_RUN: "1"
          DEMO: "month"
        run: python shadow.py
      - name: Демо-відео в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: cp data/shadow/demo_month.mp4 demo_month5_1811.mp4 && gh release upload reels demo_month5_1811.mp4 --clobber
