name: Службове — копіювати ключ Facebook у memorial-bot

# Разова задача (19.11.2026): записує FACEBOOK_PAGE_TOKEN у секрети репозиторію memorial-bot,
# щоб «Хвилина мовчання» могла публікувати на жовтій сторінці FB.
# Ключ ніде не виводиться: gh шифрує його й передає напряму в GitHub.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Перевірити доступ службового токена до memorial-bot
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: gh api repos/Anti-Crisis-Media-Center/memorial-bot/actions/secrets/public-key --jq .key_id > /dev/null && echo "Доступ є"
      - name: Записати ключ у секрети memorial-bot
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          FB: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: |
          test -n "$FB" || { echo "FACEBOOK_PAGE_TOKEN порожній"; exit 1; }
          printf '%s' "$FB" | gh secret set FACEBOOK_PAGE_TOKEN -R Anti-Crisis-Media-Center/memorial-bot
          gh secret list -R Anti-Crisis-Media-Center/memorial-bot | grep FACEBOOK_PAGE_TOKEN
